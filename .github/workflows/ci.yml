name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build
        run: mvn --batch-mode package

      - name: Compile smoke test
        run: |
          ./compiler -S -o target/hello.s examples/hello.sy
          test -s target/hello.s
          grep -q '^main:' target/hello.s
